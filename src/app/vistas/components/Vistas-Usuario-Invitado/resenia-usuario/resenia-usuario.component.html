<body>
    <div class="modal">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        
        <div class="modal-header">
            <h2 class="modal-title">Escriba una reseña</h2>
            <p class="modal-subtitle">Comparte tu opinión con la comunidad.</p>
        </div>

        <div class="product-info">
            <div class="product-image"></div>
            <div class="product-name">City market </div>
        </div>

        <form id="reviewForm">
            <div class="form-group">
                <label class="form-label">
                    Calificación general <span class="required">*</span>
                </label>
                <div class="star-rating" id="starRating">
                    <svg class="star" viewBox="0 0 24 24" data-rating="1">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                    <svg class="star" viewBox="0 0 24 24" data-rating="2">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                    <svg class="star" viewBox="0 0 24 24" data-rating="3">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                    <svg class="star" viewBox="0 0 24 24" data-rating="4">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                    <svg class="star" viewBox="0 0 24 24" data-rating="5">
                        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Tu reseña <span class="required">*</span>
                </label>
                <textarea 
                    class="textarea" 
                    id="reviewText"
                    placeholder="Describe lo que te gustó y lo que no te gustó, y comparte información clave que los anunciantes deben saber. Mínimo de 30 caracteres."
                    maxlength="500"
                    oninput="updateCharacterCount()"
                ></textarea>
                <div class="character-count">
                    <span id="charCount">0</span>/500 caracteres
                </div>
                <div class="textarea-hint">
                    Describe lo que te gustó y lo que no te gustó, y comparte información clave que los compradores deben saber. Mínimo de 30 caracteres.
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                    Enviar reseña
                </button>
            </div>
        </form>
    </div>
</body>
