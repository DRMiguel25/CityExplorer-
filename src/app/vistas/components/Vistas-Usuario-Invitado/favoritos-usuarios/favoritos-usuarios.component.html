<navbar-invitado-usuario></navbar-invitado-usuario>

<div class="main-content" style="padding: 6rem 2rem;">
  <h1 class="page-title">Favoritos</h1>

  <!-- Si no hay favoritos -->
  <div *ngIf="favoritosFiltrados.length === 0" class="no-favorites" style="text-align: center;">
    <p class="mensaje-vacio" style="color: #6B7280; font-size: 1.25rem;">
      Aún no has agregado ningún lugar a tus favoritos.<br>
      ¡Explora y guarda los que más te gusten!
    </p>
  </div>

  <!-- Si hay favoritos -->
  <div class="cards-container" *ngIf="favoritosFiltrados.length > 0">
    <div class="card" *ngFor="let fav of favoritosFiltrados" (click)="vistaDetalladaDestino(fav.lugar.id_lugar)">
      <div class="card-header">
        <div class="card-title-text">{{ fav.lugar.nombre }}</div>
        <button 
          class="card-header-favorite active" 
          (click)="toggleFavorito(fav.lugar.id_lugar); $event.stopPropagation()"
        >
          <i class="fas fa-heart"></i>
        </button>
      </div>

      <div class="card-img-container">
        <img 
          [src]="fav.lugar.url || 'https://via.placeholder.com/400x300'" 
          alt="Imagen lugar" 
          class="card-img"
        />
        <div class="category-tags">
          <span class="category-tag">Favorito</span>
        </div>
      </div>

      <div class="card-body">
        <div class="card-title">Descripción</div>
        <div class="card-text">{{ fav.lugar.descripcion }}</div>
        <div class="card-info">
          <div class="rating">
            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
            <i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
            <span>4.5</span>
          </div>
          <div class="price">
            {{ fav.fecha_agregado | date:'dd MMM yyyy' }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
