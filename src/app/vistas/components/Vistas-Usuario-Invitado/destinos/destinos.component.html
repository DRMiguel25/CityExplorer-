<navbar-invitado-usuario></navbar-invitado-usuario>
<body>
  <main class="main-content">
    <!-- Breadcrumbs -->
    <div class="breadcrumbs"></div>

    <!-- Page Title -->
   <h1 class="page-title" style="color: #5BA7F7;">Destinos Increíbles</h1>


    <!-- Filters Section -->
    <div class="filters-section">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Buscar destinos...">
        <i class="fas fa-search search-icon"></i>
      </div>

      <div class="filter-tags">
        <span class="filter-tag active">Todos</span>
        <span class="filter-tag">5 Estrellas</span> 
        <span class="filter-tag">4 Estrellas</span>
        <span class="filter-tag">3 Estrellas</span>
        <span class="filter-tag">2 Estrellas</span>
        <span class="filter-tag">1 Estrella </span>
      </div>
    </div>

    <!-- Cards Container -->
    <div class="cards-container">
      <div class="card" *ngFor="let lugar of lugares" (click)="vistaDetalladaDestino(lugar.id_lugar)">
        <div class="card-header">
          <div>{{ lugar.nombre }}</div>
        </div>

        <div class="card-img-container">
          <img
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=250&fit=crop"
            alt="{{ lugar.nombre }}"
            class="card-img">
          <div class="category-tags">
            <span class="category-tag">MONTAÑA</span>
          </div>
        </div>

        <div class="card-body">
          <div class="card-title">Descripción</div>
          <div class="card-text">
            {{ lugar.descripcion || 'No hay descripción disponible.' }}
          </div>
          <div class="card-info">
            <div class="rating">
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star-half-alt"></i>
              <span>4.2</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
