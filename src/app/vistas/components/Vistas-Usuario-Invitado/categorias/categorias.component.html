<navbar-invitado-usuario></navbar-invitado-usuario>

<div class="background-slideshow"></div>
<div class="overlay"></div>

<div class="main-content">
  <div class="header">
    <h1>Categorías</h1>
  </div>

  <div class="categories-grid">
    <div 
      class="category-item" 
      *ngFor="let categoria of listaCategorias" 
      (click)="vistaCategorias(categoria.nombre || categoria.categoria || categoria.titulo)">
      
      <div class="category-icon">
        <!-- Aquí puedes ajustar según la propiedad que contenga el ícono en la API -->
        <span class="material-symbols-outlined">{{ categoria.icono || 'category' }}</span>
      </div>

      <button class="category-button">
        {{ categoria.nombre || categoria.categoria || categoria.titulo }}
      </button>
    </div>
  </div>
</div>
