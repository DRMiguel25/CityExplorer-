<body>
    <div class="container">
        <h1>Editar perfil</h1>
        
        <form>
            <div class="form-group">
                <label for="photo">Foto de perfil</label>
                <div class="profile-photo-section">
                    <div class="photo-preview" id="photoPreview">
                        👤
                    </div>
                    <div class="file-input-wrapper">
                        <input type="file" id="photo" class="file-input" accept="image/*">
                        <div class="file-button">Seleccionar imagen</div>
                    </div>
                    <p style="margin-top: 8px; font-size: 12px; color: #666;">JPG, PNG o GIF. Máximo 2MB.</p>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Nombre</label>
                <input type="email" id="email" placeholder="Tu Nombre">
            </div>

             <div class="form-group">
                <label for="email">Apellido paterno</label>
                <input type="email" id="email" placeholder="Tu apellido paterno">
            </div>

             <div class="form-group">
                <label for="email">Apellido materno</label>
                <input type="email" id="email" placeholder="Tu apellido materno">
            </div>

             <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Tu dirección de email">
            </div>
           

            <div class="button-container">
                <button type="button" class="btn btn-cancel">Cancelar</button>
                <button type="submit" class="btn btn-save">Guardar perfil</button>
            </div>
        </form>
    </div>
</body>
