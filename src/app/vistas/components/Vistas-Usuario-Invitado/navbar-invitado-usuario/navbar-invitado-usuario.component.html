<header class="header">
  <div class="logo" (click)="goHome()">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="45" stroke="black" stroke-width="3" fill="none" />
      <path d="M20 50 H80" stroke="black" stroke-width="3" />
      <ellipse cx="50" cy="50" rx="25" ry="45" stroke="black" stroke-width="3" fill="none" />
    </svg>
  </div>

  <!-- Botón hamburguesa -->
  <button class="hamburger" aria-label="Toggle menu" (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Menú de navegación -->
  <nav class="nav-menu">
    <a [routerLink]="['/home-invitado-usuario', id_usuario]" routerLinkActive="active">Inicio</a>
    <a [routerLink]="['/destino-vista', id_usuario]" routerLinkActive="active">Destinos</a>
    <a [routerLink]="['/categorias', id_usuario]" routerLinkActive="active">Categorías</a>
    <a *ngIf="id_usuario !== 0" [routerLink]="['/favoritos-usuarios', id_usuario]" routerLinkActive="active">
      Favoritos
    </a>
    <a [routerLink]="['/ayuda', id_usuario]" routerLinkActive="active">Ayuda</a>
  </nav>


  <div class="user-icon" (click)="mostrarAlertaCrearCuenta()">
  <ng-container *ngIf="id_usuario !== 0 && usuario?.foto_perfil; else iconoDefault">
<img [src]="'http://localhost:8001/storage/' + usuario.foto_perfil" alt="Foto de perfil" class="perfil-img">
  </ng-container>

  <ng-template #iconoDefault>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8" r="4" stroke="black" stroke-width="2" />
      <path d="M20 19C20 16.2386 16.4183 14 12 14C7.58172 14 4 16.2386 4 19" stroke="black" stroke-width="2" />
    </svg>
  </ng-template>
</div>


</header>
