    <div class="container">
        <h1>Editar perfil</h1>
        
        <form>
            <div class="form-group">
                <label for="photo">Foto de perfil</label>
                <div class="profile-photo-section">
                    <div class="photo-preview" id="photoPreview">
                        👤
                    </div>
                    <div class="file-input-wrapper">
                        <input type="file" id="photo" class="file-input" accept="image/*">
                        <div class="file-button">Seleccionar imagen</div>
                    </div>
                    <p style="margin-top: 8px; font-size: 12px; color: #666;">JPG, PNG o GIF. Máximo 2MB.</p>
                </div>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre" [(ngModel)]="usuario.data.nombre" required>
            </div>

            <div class="form-group">
                <label for="apellidoP">Apellido paterno</label>
                <input type="text" id="apellidoP" name="apellidoP" placeholder="Tu apellido paterno" [(ngModel)]="usuario.data.apellidoP" required>
            </div>

            <div class="form-group">
                <label for="apellidoM">Apellido materno</label>
                <input type="text" id="apellidoM" name="apellidoM" placeholder="Tu apellido materno" [(ngModel)]="usuario.data.apellidoM">
            </div>

            <div class="form-group">
                <label for="correo">Email</label>
                <input type="email" id="correo" name="correo" placeholder="Tu dirección de email" [(ngModel)]="usuario.data.correo" required email>
            </div>


            <div class="button-container">
                <button type="button" class="btn btn-cancel" (click)="cancelar()">Cancelar</button>
                <button type="submit" class="btn btn-save">Guardar perfil</button>
            </div>
        </form>
    </div>
