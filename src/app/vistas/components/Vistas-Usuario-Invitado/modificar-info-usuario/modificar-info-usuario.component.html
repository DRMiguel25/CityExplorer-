<div class="container">
  <h1>Editar perfil</h1>

  <form (ngSubmit)="guardarPerfil()">
    <div class="form-group">
      <label for="photo">Foto de perfil</label>
      <div class="profile-photo-section">
        <div class="photo-preview" id="photoPreview">👤</div>
        <div class="file-input-wrapper">
          <input type="file" id="photo" class="file-input" accept="image/*" (change)="seleccionarFoto($event)">
          <div class="file-button">Seleccionar imagen</div>
        </div>
        <p style="margin-top: 8px; font-size: 12px; color: #666;">JPG, PNG o GIF. Máximo 2MB.</p>
      </div>
    </div>

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" [(ngModel)]="usuario.data.nombre" required>
    </div>

    <div class="form-group">
      <label for="apellidoP">Apellido paterno</label>
      <input type="text" id="apellidoP" name="apellidoP" [(ngModel)]="usuario.data.apellidoP" required>
    </div>

    <div class="form-group">
      <label for="apellidoM">Apellido materno</label>
      <input type="text" id="apellidoM" name="apellidoM" [(ngModel)]="usuario.data.apellidoM">
    </div>

    <div class="form-group">
      <label for="correo">Email</label>
      <input type="email" id="correo" name="correo" [(ngModel)]="usuario.data.correo" required disabled>
    </div>


    <div class="button-container">
      <button type="button" class="btn btn-cancel" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn btn-save" (click)="guardarPerfil()">Guardar perfil</button>
    </div>
  </form>
</div>
