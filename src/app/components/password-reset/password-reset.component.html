<div class="password-reset-container">
  <h2 *ngIf="currentStep === 1">Recuperar contraseña</h2>
  <h2 *ngIf="currentStep === 2">Cambiar contraseña</h2>

  <!-- Mensajes -->
  <div *ngIf="success" class="alert alert-success">
    {{ success }}
  </div>
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Paso 1: Enviar código -->
  <form *ngIf="currentStep === 1" [formGroup]="correoForm" (ngSubmit)="sendResetCode()">
    <label for="correo">Correo electrónico</label>
    <input
      type="email"
      id="correo"
      formControlName="correo"
      placeholder="Introduce tu correo"
    />
    <div *ngIf="correoControl?.invalid && correoControl?.touched" class="error">
      Ingresa un correo válido.
    </div>

    <button type="submit" [disabled]="loading || correoForm.invalid">
      {{ loading ? 'Enviando...' : 'Enviar código' }}
    </button>
  </form>

  <!-- Paso 2: Ingresar código y nueva contraseña -->
  <form *ngIf="currentStep === 2" [formGroup]="resetForm" (ngSubmit)="resetPassword()">
    <label for="code">Código (6 dígitos)</label>
    <input
      type="text"
      id="code"
      formControlName="code"
      maxlength="6"
      placeholder="Código de verificación"
      (input)="onCodeInput($event)"
    />
    <div *ngIf="codeControl?.invalid && codeControl?.touched" class="error">
      Ingresa un código de 6 dígitos.
    </div>

    <label for="password">Nueva contraseña</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      placeholder="Nueva contraseña"
    />
    <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="error">
      La contraseña debe tener al menos 8 caracteres.
    </div>

    <label for="password_confirmation">Confirmar contraseña</label>
    <input
      type="password"
      id="password_confirmation"
      formControlName="password_confirmation"
      placeholder="Confirma la contraseña"
    />
    <div *ngIf="confirmPasswordControl?.invalid || resetForm.hasError('passwordMismatch')" class="error">
      Las contraseñas no coinciden.
    </div>

    <div class="timer-info">
      <p><strong>Intentos restantes:</strong> {{ remainingAttempts }}</p>
      <p><strong>Tiempo restante:</strong> {{ formatTime(timeRemaining) }}</p>
    </div>

    <button type="submit" [disabled]="loading || resetForm.invalid">
      {{ loading ? 'Restableciendo...' : 'Cambiar contraseña' }}
    </button>

    <button type="button" (click)="resendCode()" [disabled]="loading">
      Reenviar código
    </button>

    <button type="button" (click)="backToStep1()">
      Volver
    </button>
  </form>
</div>
