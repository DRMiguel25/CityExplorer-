<div class="restablecer-container">
  <h2>Restablecer Contraseña</h2>

   <div class="step-indicator">
    <div class="step" [class.active]="currentStep === 1" [class.completed]="currentStep > 1">
      1
      <div class="step-label">Correo</div>
    </div>
    <div class="step-connector" [class.active]="currentStep > 1"></div>
    <div class="step" [class.active]="currentStep === 2" [class.inactive]="currentStep < 2">
      2
      <div class="step-label">Verificar</div>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success">{{ success }}</div>


  <!-- Paso 1: Enviar correo -->
  <form *ngIf="currentStep === 1" (ngSubmit)="enviarCorreo()">
    <label for="correo">Correo electrónico:</label>
    <input
      type="email"
      id="correo"
      [(ngModel)]="correo"
      name="correo"
      required
    />
    <button type="submit" [disabled]="loading">Enviar código</button>
  </form>

  <!-- Paso 2: Ingresar código y nueva contraseña -->
  <form *ngIf="currentStep === 2" (ngSubmit)="cambiarClave()">
    <label for="codigo">Código recibido:</label>
    <input
      type="text"
      id="codigo"
      [(ngModel)]="codigo"
      name="codigo"
      required
    />

    <label for="password">Nueva contraseña:</label>
    <input
      type="password"
      id="password"
      [(ngModel)]="password"
      name="password"
      required
    />

    <label for="confirmPassword">Confirmar contraseña:</label>
    <input
      type="password"
      id="confirmPassword"
      [(ngModel)]="confirmPassword"
      name="confirmPassword"
      required
    />

    <div class="contador">
      <p>Código válido por: <strong>{{ tiempoFormateado }}</strong></p>
    </div>


    <button type="submit" [disabled]="loading">Cambiar contraseña</button>
    <button type="button" (click)="reenviarCodigo()" [disabled]="loading">
      Reenviar código
    </button>
  </form>

  <button type="button" (click)="volver()">Volver</button>
</div>
