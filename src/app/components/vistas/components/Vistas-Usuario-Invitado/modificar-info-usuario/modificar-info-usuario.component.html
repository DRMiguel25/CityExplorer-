<div class="container">
  <h1>Editar perfil</h1>

  <form [formGroup]="usuarioForm" (ngSubmit)="guardarPerfil()">
    <div class="form-group">
      <label for="photo">Foto de perfil</label>
      <div class="profile-photo-section">
        <div class="photo-preview" id="photoPreview">
          <img *ngIf="fotoPreviewUrl; else defaultIcon" [src]="fotoPreviewUrl" class="img-preview"/>
          <ng-template #defaultIcon>👤</ng-template>
        </div>
        <div class="file-input-wrapper">
          <input type="file" id="photo" class="file-input" accept="image/*" (change)="seleccionarFoto($event)">
          <div class="file-button">Cambiar imagen</div>
        </div>
        <p style="margin-top: 8px; font-size: 12px; color: #666;">
          Formatos permitidos: JPG, PNG o GIF. Máximo 2MB.
        </p>
      </div>
    </div>

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" formControlName="nombre" required>
      <div *ngIf="isInvalid('nombre')" class="text-danger-bold">El nombre es obligatorio</div>
    </div>

    <div class="form-group">
      <label for="apellidoP">Apellido paterno</label>
      <input type="text" id="apellidoP" formControlName="apellidoP" required>
      <div *ngIf="isInvalid('apellidoP')" class="text-danger-bold">El apellido paterno es obligatorio</div>
    </div>

    <div class="form-group">
      <label for="apellidoM">Apellido materno</label>
      <input type="text" id="apellidoM" formControlName="apellidoM">
      <div *ngIf="isInvalid('apellidoM')" class="text-danger-bold">El apellido materno es obligatorio</div>
    </div>

    <div class="form-group">
      <label for="correo">Email</label>
      <input type="email" id="correo" formControlName="correo" [disabled]="true">
      <div *ngIf="isInvalid('correo')" class="text-danger-bold">El correo es obligatorio</div>
    </div>

    <div class="button-container">
      <button type="button" class="btn btn-cancel" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn btn-save">Guardar perfil</button>
    </div>
  </form>
</div>
